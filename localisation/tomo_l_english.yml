 #AlpineConfederation
 SAC_ADJ: "Alpine"
 alpine_nation_title:0 "Unite the Cantons into the Alpine Confederation"
 alpine_nation_desc:0 "Too long have the Swiss people gone unprotected under foreign flags. It is time to unite under one banner."
 SAC:0 "Alpine Confederation"
 SAC_ideas:0 "Alpine Ideas"
 SAC_ideas_start:0 "Alpine Traditions"
 SAC_ideas_bonus:0 "Alpine Ambitions"
 defensive_of_the_alps:0 "Defense of the Alps"
 defensive_of_the_alps_desc:0 "Build the Bunkers, Defend our People. The Alps cannot be allowed to fall."
 defense_in_depth:0 "Defensive In Depth"
 defense_in_depth_desc:0 "By implementing a defensive in depth strategy we can lure our enemies into a trap."
 SAC_idea1:0 "Swiss Mercenaries"
 SAC_idea2:0 "Oasis of Peace and Prosperity"
 SAC_idea5:0 "Modernize the Infantry"
 SAC_idea7:0 "Swiss Tolerance"
 SAC_idea1_desc:0 "How many kings have had cause to shout 'Summon the Switzers' whenever there had been an assassination attempt? From the Swiss Guard who protect His Holiness in Rome to the Swiss mercenaries serving as auxilaries and bodyguards in most of the courts of Christendom, Swiss mercenaries have proven legendary in their ability."
 SAC_idea2_desc:0 "Even as the most gruesome of wars rages, there's usually little call to brign Switzerland in: after all, both sides need their Swiss mercenaries and neither wants to be cut off. Perhaps if peace is prosperity, we should focus more on peace."
 SAC_idea5_desc:0 ""In the Constitution of 1874, Our military was expanded into a universal militia. Without a formal standing army our people are more willing to die to protect their land"
 SAC_idea7_desc:0 "The Reformation threatens to tear our land apart. Some provicnes join the Protestant movement, other Reform and still others remain Catholic. Our land is ravaged by violence and confusion. Why must we kill each other over transubstaniation and predestination when we could turn our mountian home into a realm united once more?"